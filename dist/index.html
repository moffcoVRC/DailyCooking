<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#47735a"><meta name="description" content="3人家族の、がんばりすぎない夕飯献立。買う・作る・今日はお休みも、これひとつ。"><meta name="apple-mobile-web-app-capable" content="yes"><title>まいにち、夕飯。</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"></head><body><header class="brand"><a href="./">まいにち、夕飯<span>暮らしに、ちょうどいい献立。</span></a><span class="family">3人の食卓</span></header><main id="app"><p>献立を準備しています…</p></main><nav class="bottom" aria-label="メインメニュー"><button data-view="today">♧<span>今日</span></button><button data-view="week">▦<span>1週間</span></button><button data-view="favorites">♡<span>お気に入り</span></button><button data-view="settings">⚙<span>設定</span></button></nav><dialog id="skip-dialog"><form id="skip-form"><div class="eyebrow">TAKE A BREAK</div><h2>今日は、ひと休み。</h2><p>作らない日も、いつもの暮らし。<br>献立は予定に合わせて動かせます。</p><label>理由 <small>選ばなくてもOK</small><select name="reason"><option value="">理由を選ばない</option><option>外食</option><option>惣菜・弁当</option><option>家にある物で済ませる</option><option>予定あり</option><option>その他</option></select></label><fieldset><legend>予定していた献立はどうする？</legend><label class="choice"><input type="radio" name="action" value="tomorrow" checked> 明日に送る</label><p class="hint">翌日以降の未調理の献立を順送りします。お休み・食事済みの日はそのままです。</p><label class="choice"><input type="radio" name="action" value="skip"> 飛ばす（今週は使わない）</label></fieldset><button class="primary" type="submit">今日は作らない</button><button class="text-button" type="button" id="cancel-skip">戻る</button><p id="skip-error" role="alert"></p></form></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js"></script></body></html>
